# Publishes the dbt docs (models, columns, tests, lineage) to GitHub Pages on every push to main that touches the
# dbt project. No data is needed: the docs come from the project files, with an empty catalog.
name: dbt docs

on:
  push:
    branches: [main]
    paths:
      - "analytics/dbt/**"
      - "analytics/requirements.txt"
      - ".github/workflows/dbt-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics/requirements.txt
      - run: pip install -r analytics/requirements.txt
      - name: Generate the docs
        env:
          DBT_DUCKDB_PATH: ":memory:"
        run: |
          dbt docs generate --project-dir analytics/dbt --profiles-dir analytics/dbt --target duckdb \
            --target-path "$RUNNER_TEMP/dbt" --log-path "$RUNNER_TEMP/dbt/logs" --empty-catalog --static \
            --vars '{"landing_path": "data/analytics/landing", "loaded_at": "1970-01-01 00:00:00", "pseudonym_salt": "docs"}'
          mkdir -p _site
          cp "$RUNNER_TEMP/dbt/static_index.html" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
