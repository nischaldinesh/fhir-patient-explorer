<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 842" width="1640" height="842" role="img" aria-labelledby="t d" font-family="Poppins, Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">FHIR Patient Explorer data pipeline</title>
<desc id="d">Six columns read left to right: where data starts, make it the same, system of record, nightly copy out, warehouse, and who reads it. A nightly Airflow 3 run orchestrates every step, and a dashed arrow writes warehouse metrics back to the FHIR server.</desc>
