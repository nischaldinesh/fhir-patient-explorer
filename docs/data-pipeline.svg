<text class="h" x="135.0" y="330.0">MIMIC IV</text>
<text class="s" x="135.0" y="356.0">real, deidentified <tspan class="b">FHIR</tspan> data</text>
<text class="s" x="135.0" y="375.0">acts like an old EHR</text>
<path class="ar" d="M235 334.0 H293" marker-end="url(#a)"/>
<rect class="box" x="35" y="404" width="200" height="100" rx="8" filter="url(#sh)"/>
<g class="ic" transform="translate(125.0 409.0) scale(0.833)"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
<text class="h" x="135.0" y="450.0">Synthea</text>
<text class="s" x="135.0" y="476.0">synthetic <tspan class="b">FHIR R4</tspan> bundles</text>
<text class="s" x="135.0" y="495.0">acts like a modern EHR</text>
<path class="ar" d="M235 454.0 H293" marker-end="url(#a)"/>
<rect class="box" x="35" y="524" width="200" height="100" rx="8" filter="url(#sh)"/>
<g class="ic" transform="translate(125.0 529.0) scale(0.833)"><path d="M4 19.5V5a2 2 0 0 1 2-2h14v15H6.5A2.5 2.5 0 0 0 4 20.5 2.5 2.5 0 0 0 6.5 23H20"/><path d="M8 7h8"/></g>
<text class="h" x="135.0" y="570.0">Code systems</text>
<text class="s" x="135.0" y="596.0"><tspan class="b">LOINC</tspan> and <tspan class="b">CMS GEMs</tspan></text>
<text class="s" x="135.0" y="615.0">ICD 9 to 10 dictionaries</text>
