<g class="ic" transform="translate(889.0 379.5) scale(0.833)"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></g>
<text class="h" x="899.0" y="420.5">Bulk Data $export</text>
<text class="s" x="899.0" y="446.5">incremental with a</text>
<text class="s" x="899.0" y="465.5"><tspan class="b">_since</tspan> watermark,</text>
<text class="s" x="899.0" y="484.5">resumable, <tspan class="b">SMART</tspan> auth</text>
<path class="ar" d="M751 234 H809" marker-end="url(#a)"/>
<path class="ar" d="M751 434 H809" marker-end="url(#a)"/>
<text class="cap" x="799" y="544">LANDING</text>
<text class="l" x="799" y="568"><tspan class="b">NDJSON</tspan> files + a manifest,</text>
<text class="l" x="799" y="587">replayable at any time</text>
