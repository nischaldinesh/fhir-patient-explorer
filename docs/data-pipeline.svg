<text class="h" x="899.0" y="220.5">Paged FHIR search</text>
<text class="s" x="899.0" y="246.5">full extract,</text>
<text class="s" x="899.0" y="265.5"><tspan class="b">cache bypassed</tspan>,</text>
<text class="s" x="899.0" y="284.5">completeness check</text>
