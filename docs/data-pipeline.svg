<g class="ic" transform="translate(383.0 169.0) scale(0.833)"><path d="M3 4h18l-7 8.5V19l-4 2v-8.5z"/></g>
<text class="h" x="393.0" y="210.0">Interface pipeline</text>
<text class="s" x="393.0" y="236.0">parse, route, <tspan class="b">dedupe</tspan>,</text>
<text class="s" x="393.0" y="255.0">quarantine bad messages</text>
