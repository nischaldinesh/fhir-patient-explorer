<rect class="bg" width="1640" height="842"/>
<text class="title" x="820.0" y="52" text-anchor="middle">FHIR Patient Explorer data pipeline</text>
<text class="sub" x="820.0" y="82" text-anchor="middle">From <tspan class="b">HL7 v2</tspan> and <tspan class="b">FHIR</tspan> sources to a tested, governed <tspan class="b">dbt</tspan> warehouse, a metrics API and <tspan class="b">Tableau</tspan> dashboards.</text>
<circle class="badge" cx="45" cy="122" r="10"/>
<text class="bn" x="45" y="126.5">1</text>
<text class="col" x="63" y="127">WHERE DATA STARTS</text>
<circle class="badge" cx="293" cy="122" r="10"/>
<text class="bn" x="293" y="126.5">2</text>
<text class="col" x="311" y="127">MAKE IT THE SAME</text>
<circle class="badge" cx="561" cy="122" r="10"/>
<text class="bn" x="561" y="126.5">3</text>
<text class="col" x="579" y="127">SYSTEM OF RECORD</text>
<circle class="badge" cx="809" cy="122" r="10"/>
<text class="bn" x="809" y="126.5">4</text>
<text class="col" x="827" y="127">NIGHTLY COPY OUT</text>
<circle class="badge" cx="1087" cy="122" r="10"/>
<text class="bn" x="1087" y="126.5">5</text>
<text class="col" x="1105" y="127">WAREHOUSE</text>
<circle class="badge" cx="1405" cy="122" r="10"/>
<text class="bn" x="1405" y="126.5">6</text>
<text class="col" x="1423" y="127">WHO READS IT</text>
