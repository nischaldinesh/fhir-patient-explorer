<g class="ic" transform="translate(638.0 216.0) scale(1.083)"><rect x="3" y="3" width="18" height="8" rx="2"/><rect x="3" y="13" width="18" height="8" rx="2"/><path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"/></g>
<text class="h" x="651.0" y="262">HAPI FHIR R4</text>
<text class="s" x="651.0" y="282">on Postgres</text>
<line class="sep" x1="591" y1="304" x2="711" y2="304"/>
<text class="s" x="651.0" y="334">the <tspan class="b">operational store</tspan></text>
<text class="s" x="651.0" y="353">fast for one patient</text>
<line class="sep" x1="591" y1="378" x2="711" y2="378"/>
<text class="s" x="651.0" y="408">every record tagged</text>
<text class="s" x="651.0" y="427">with its source</text>
<rect class="box" x="551" y="524" width="200" height="100" rx="8" filter="url(#sh)"/>
<g class="ic" transform="translate(641.0 529.0) scale(0.833)"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-4"/></g>
<text class="h" x="651.0" y="570.0">Written back</text>
<text class="s" x="651.0" y="596.0"><tspan class="b">worklists</tspan>,</text>
<text class="s" x="651.0" y="615.0">snapshots, audit</text>
<path class="ar" d="M503 334.0 H549" marker-end="url(#a)"/>
<rect class="grp" x="799" y="152" width="200" height="364" rx="10"/>
