<text class="s" x="393.0" y="356.0"><tspan class="b">idempotent</tspan> PUT</text>
<text class="s" x="393.0" y="375.0">by stable id</text>
<rect class="box" x="295" y="404" width="196" height="100" rx="8" filter="url(#sh)"/>
<g class="ic" transform="translate(383.0 409.0) scale(0.833)"><path d="M4 8h14l-3-3M20 16H6l3 3"/></g>
<text class="h" x="393.0" y="450.0">Terminology</text>
<text class="s" x="393.0" y="476.0"><tspan class="b">ConceptMap</tspan> translation;</text>
<text class="s" x="393.0" y="495.0"><tspan class="b">LLM</tspan> suggests LOINC</text>
<rect class="box" x="295" y="524" width="196" height="100" rx="8" filter="url(#sh)"/>
<g class="ic" transform="translate(383.0 529.0) scale(0.833)"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.6"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15.5 14.2c3 0 5.5 2.3 5.5 5.8"/></g>
<text class="h" x="393.0" y="570.0">Patient matching</text>
<text class="s" x="393.0" y="596.0"><tspan class="b">EMPI</tspan>: links,</text>
<text class="s" x="393.0" y="615.0">never merges</text>
