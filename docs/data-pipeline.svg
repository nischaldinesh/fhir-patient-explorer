<text class="h" x="135.0" y="210.0">HL7 v2 feed</text>
<text class="s" x="135.0" y="236.0">live <tspan class="b">ADT</tspan> and <tspan class="b">ORU</tspan> messages</text>
<text class="s" x="135.0" y="255.0">the hospital interface</text>
