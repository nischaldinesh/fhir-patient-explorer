# Overrides layered on top of the HAPI image defaults.
spring:
  datasource:
    url: 'jdbc:postgresql://db:5432/hapi'
    username: admin
    password: admin
    driverClassName: org.postgresql.Driver
  jpa:
    properties:
      hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      hibernate.search.enabled: false

hapi:
  fhir:
    fhir_version: R4
    # MIMIC and Synthea bring their own resource ids; keep them as is.
    client_id_strategy: ANY
    server_id_strategy: UUID
    # Bulk loads arrive in any order, so do not reject dangling references.
    enforce_referential_integrity_on_write: false
    enforce_referential_integrity_on_delete: false
    allow_external_references: true
    cors:
      allowed_origin:
        - "*"
